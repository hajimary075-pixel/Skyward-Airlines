<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destinations</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container" style="padding-top:30px;">
  <h1>Where We Fly</h1>
  <p class="section-sub">Explore our destinations across the continent.</p>
  <div class="grid grid-3" id="list"></div>
</main>
<a href="#" class="whatsapp-float" id="whatsapp-float"></a>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script>
(async function () {
  await App.initLayout("/destinations");
  const { results } = await App.api("/destinations");
  document.getElementById("list").innerHTML = results
    .map(
      (d) => `
    <a class="card" href="/destination?slug=${d.slug}" style="text-decoration:none;color:inherit;">
      <img src="${d.hero_image}" alt="${d.name}" onerror="this.style.background='#ddd'">
      <div class="card-body">
        <h3>${d.name}, ${d.country}</h3>
        <p>${d.description}</p>
      </div>
    </a>`
    )
    .join("");
})();
</script>
</body>
</html>
