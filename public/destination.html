<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destination</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main id="content" class="container" style="padding-top:30px;">Loading...</main>
<a href="#" class="whatsapp-float" id="whatsapp-float"></a>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script>
(async function () {
  const cfg = await App.initLayout(null, "Hello, I would like information about flights.");
  const slug = App.qs("slug");
  const el = document.getElementById("content");
  try {
    const { destination, flights } = await App.api("/destinations/" + slug);
    document.title = destination.name + " | " + cfg.company.name;
    const m = destination.media || {};
    const heroAlt = (m.hero && m.hero.alt) || destination.name;
    el.innerHTML = `
      <h1>${destination.name}, ${destination.country}</h1>
      <img src="${destination.hero_image}" alt="${heroAlt}" style="max-height:280px;object-fit:cover;width:100%;border-radius:12px;margin-bottom:20px;" onerror="this.style.display='none'">
      <p>${destination.description}</p>
      ${m.hero ? `
      <h2 style="font-size:1.2rem;">${m.hero.heading}</h2>
      <p>${m.hero.body}</p>` : ""}
      ${destination.gallery && destination.gallery.length ? `
      <h2 style="font-size:1.2rem;">Gallery</h2>
      <div class="grid grid-3" style="margin-bottom:30px;">
        ${destination.gallery.map((src, i) => {
          const cap = m.gallery && m.gallery[i];
          const alt = (cap && cap.alt) || (destination.name + " photo");
          return `<div class="card">
            <img src="${src}" alt="${alt}" onerror="this.style.display='none'">
            ${cap ? `<div class="card-body"><h3>${cap.heading}</h3><p>${cap.body}</p></div>` : ""}
          </div>`;
        }).join("")}
      </div>` : ""}
      <h2 style="font-size:1.2rem;">Things to do</h2>
      <ul>${destination.attractions.map((a) => `<li>${a}</li>`).join("")}</ul>
      <h2 style="font-size:1.2rem;">Flights to ${destination.name}</h2>
      ${flights.length ? flights.map((f) => `
        <div class="flight-row">
          <div><div class="times">${f.departure_time} &rarr; ${f.arrival_time}</div><div class="meta">${f.flight_number}</div></div>
          <div>from ${f.origin}</div>
          <div class="price-tag">${App.fmtMoney(f.base_fare, cfg.payment.currency)}</div>
          <a class="btn" href="/search?origin=${f.origin}&destination=${f.destination}">Book</a>
        </div>`).join("") : "<p>No direct flights currently scheduled — check back soon.</p>"}
      <div style="margin-top:20px;">
        <a class="btn" href="/search?destination=${destination.airport_code}">Search Flights to ${destination.name}</a>
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">Destination not found.</div>`;
  }
})();
</script>
</body>
</html>
