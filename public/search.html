<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Search Results</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container" style="padding-top:30px;">
  <h1 id="route-heading">Flights</h1>

  <div class="filters-bar">
    <div class="field">
      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="price">Price (lowest first)</option>
        <option value="departure">Departure time</option>
        <option value="duration">Duration</option>
      </select>
    </div>
    <div class="field">
      <label for="maxPrice">Max price</label>
      <input type="number" id="maxPrice" placeholder="Any">
    </div>
    <button id="apply-filters" class="btn-outline" style="background:transparent;border:2px solid var(--primary);color:var(--primary);">Apply</button>
  </div>

  <div id="results"></div>
</main>
<a href="#" class="whatsapp-float" id="whatsapp-float"></a>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script>
(async function () {
  const cfg = await App.initLayout("/search");
  const origin = App.qs("origin");
  const destination = App.qs("destination");
  const date = App.qs("date");
  const passengers = Number(App.qs("passengers") || 1);

  document.getElementById("route-heading").textContent =
    origin && destination ? `${origin} to ${destination} — ${date || "any date"}` : "All Flights";

  async function loadResults() {
    const params = new URLSearchParams();
    if (origin) params.set("origin", origin);
    if (destination) params.set("destination", destination);
    if (date) params.set("date", date);
    params.set("sort", document.getElementById("sort").value);
    const maxPrice = document.getElementById("maxPrice").value;
    if (maxPrice) params.set("maxPrice", maxPrice);

    const { results } = await App.api("/flights/search?" + params.toString());
    const el = document.getElementById("results");
    if (!results.length) {
      el.innerHTML = `<div class="alert alert-error">No flights matched your search. Try a different date or route.</div>`;
      return;
    }
    el.innerHTML = results
      .map((f) => {
        const enough = f.seats_available >= passengers;
        return `
      <div class="flight-row">
        <div>
          <div class="times">${f.departure_time} &rarr; ${f.arrival_time}</div>
          <div class="meta">${f.flight_number} &middot; ${f.aircraft_name}</div>
        </div>
        <div>
          <div class="meta">Route</div>
          <div>${f.origin} &rarr; ${f.destination}</div>
          <div class="meta">${enough ? `<span class="badge badge-success">${f.seats_available} seats left</span>` : `<span class="badge badge-danger">Not enough seats</span>`}</div>
        </div>
        <div>
          <div class="meta">Adult fare from</div>
          <div class="price-tag">${App.fmtMoney(f.base_fare, cfg.payment.currency)}</div>
          <div class="meta">+ taxes &amp; fees, calculated at checkout</div>
        </div>
        <div>
          <button ${enough ? "" : "disabled"} onclick="selectFlight('${f.id}')">Select</button>
        </div>
      </div>`;
      })
      .join("");
  }

  window.selectFlight = function (flightId) {
    const params = new URLSearchParams({ flightId, passengers, date: date || "" });
    location.href = "/booking?" + params.toString();
  };

  document.getElementById("apply-filters").addEventListener("click", loadResults);
  loadResults();
})();
</script>
</body>
</html>
