<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main class="container" style="padding-top:30px;max-width:800px;">
  <h1>Contact Us</h1>
  <div id="contact-details" class="summary-box" style="margin-bottom:24px;"></div>

  <form id="contact-form">
    <div class="field-row">
      <div class="field"><label for="name">Name</label><input id="name" required></div>
      <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      <div class="field"><label for="phone">Phone</label><input id="phone"></div>
      <div class="field"><label for="subject">Subject</label><input id="subject" required></div>
    </div>
    <div class="field" style="margin:14px 0;">
      <label for="message">Message</label>
      <textarea id="message" rows="5" required></textarea>
    </div>
    <div id="form-error" class="alert alert-error" style="display:none;"></div>
    <div id="form-success" class="alert alert-success" style="display:none;"></div>
    <button type="submit">Send Message</button>
  </form>
</main>
<a href="#" class="whatsapp-float" id="whatsapp-float"></a>
<footer class="site-footer" id="site-footer"></footer>
<script src="/js/app.js"></script>
<script>
(async function () {
  const cfg = await App.initLayout("/contact", "Hello, I would like to contact customer support.");
  document.getElementById("contact-details").innerHTML = `
    <div class="summary-row"><span>Phone</span><span>${cfg.contact.phone}</span></div>
    <div class="summary-row"><span>Email</span><span>${cfg.contact.email}</span></div>
    <div class="summary-row"><span>Address</span><span>${cfg.contact.address}</span></div>
    <div class="summary-row"><span>Hours</span><span>${cfg.contact.hours}</span></div>
  `;

  document.getElementById("contact-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("form-error");
    const successEl = document.getElementById("form-success");
    errorEl.style.display = "none";
    successEl.style.display = "none";
    try {
      await App.api("/contact", {
        method: "POST",
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          subject: document.getElementById("subject").value,
          message: document.getElementById("message").value,
        }),
      });
      successEl.textContent = "Thanks — your message has been received. Our team will respond soon.";
      successEl.style.display = "block";
      e.target.reset();
    } catch (err) {
      errorEl.textContent = (err.data && err.data.errors && err.data.errors.join("; ")) || "Something went wrong.";
      errorEl.style.display = "block";
    }
  });
})();
</script>
</body>
</html>
